name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Node and NPM
        shell: powershell
        run: |
          node --version
          npm --version

      - name: Check required files
        shell: powershell
        run: |
          if (!(Test-Path "package.json")) {
            Write-Error "package.json not found"
            exit 1
          }

          if (!(Test-Path "main.js")) {
            Write-Error "main.js not found"
            exit 1
          }

          if (!(Test-Path "app/index.html")) {
            Write-Error "app/index.html not found"
            exit 1
          }

          Write-Host "All required files found"

      - name: Install dependencies
        shell: powershell
        run: |
          npm install

      - name: Build Windows EXE
        shell: powershell
        run: |
          npm run dist

      - name: Check EXE
        shell: powershell
        run: |
          Write-Host "Files created:"
          Get-ChildItem "dist" -Recurse

          $exe = Get-ChildItem "dist\*.exe" -ErrorAction SilentlyContinue

          if (!$exe) {
            Write-Error "EXE was not created"
            exit 1
          }

      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: BendCalculator-Windows-EXE
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 30
