name: Build Bend Calculator Windows

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build-windows:
    runs-on: windows-latest

    steps:

      # ==========================================
      # 1. Download repository
      # ==========================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ==========================================
      # 2. Check index.html
      # ==========================================

      - name: Check index.html
        shell: powershell
        run: |
          Write-Host "Checking repository files..."

          Get-ChildItem

          if (!(Test-Path "index.html")) {
              Write-Error "ERROR: index.html was not found in repository root"
              exit 1
          }

          Write-Host "SUCCESS: index.html found"


      # ==========================================
      # 3. Check Node / NPM
      # ==========================================

      - name: Check Node and NPM
        shell: powershell
        run: |
          Write-Host "Node version:"
          node --version

          Write-Host "NPM version:"
          npm --version


      # ==========================================
      # 4. Create main.js automatically
      # ==========================================

      - name: Create Electron main.js
        shell: powershell
        run: |
          @'
          const { app, BrowserWindow } = require("electron");
          const path = require("path");

          function createWindow() {

              const win = new BrowserWindow({
                  width: 1280,
                  height: 850,

                  minWidth: 900,
                  minHeight: 650,

                  autoHideMenuBar: true,

                  webPreferences: {
                      contextIsolation: true,
                      nodeIntegration: false
                  }
              });

              win.loadFile(
                  path.join(__dirname, "index.html")
              );

          }


          app.whenReady().then(() => {

              createWindow();

              app.on("activate", () => {

                  if (
                      BrowserWindow.getAllWindows().length === 0
                  ) {
                      createWindow();
                  }

              });

          });


          app.on("window-all-closed", () => {

              if (process.platform !== "darwin") {
                  app.quit();
              }

          });
          '@ | Set-Content -Path "main.js" -Encoding UTF8

          Write-Host "main.js created successfully"


      # ==========================================
      # 5. Create package.json automatically
      # ==========================================

           - name: Create package.json
        shell: powershell
        run: |
          $packageJson = @'
          {
            "name": "bend-calculator",
            "version": "4.0.1",
            "description": "Sheet Metal Bend Calculator",
            "author": "Shivanov",
            "main": "main.js",
            "scripts": {
              "start": "electron .",
              "dist": "electron-builder --win portable"
            },
            "devDependencies": {
              "electron": "33.4.11",
              "electron-builder": "25.1.8"
            },
            "build": {
              "appId": "com.shivanov.bendcalculator",
              "productName": "Bend Calculator",
              "asar": true,
              "files": [
                "index.html",
                "main.js",
                "package.json"
              ],
              "win": {
                "target": [
                  {
                    "target": "portable",
                    "arch": [
                      "x64"
                    ]
                  }
                ]
              },
              "artifactName": "BendCalculator-Windows-${version}.${ext}"
            }
          }
          '@

          [System.IO.File]::WriteAllText(
              "$PWD\package.json",
              $packageJson,
              [System.Text.UTF8Encoding]::new($false)
          )

          Write-Host "package.json created as UTF-8 without BOM"

          Write-Host "Testing package.json:"
          Get-Content package.json

          node -e "JSON.parse(require('fs').readFileSync('package.json','utf8')); console.log('package.json VALID')"

      # ==========================================
      # 6. Verify generated project
      # ==========================================

      - name: Verify project
        shell: powershell
        run: |
          Write-Host "================================"
          Write-Host "PROJECT FILES"
          Write-Host "================================"

          Get-ChildItem

          if (!(Test-Path "index.html")) {
              Write-Error "index.html missing"
              exit 1
          }

          if (!(Test-Path "main.js")) {
              Write-Error "main.js missing"
              exit 1
          }

          if (!(Test-Path "package.json")) {
              Write-Error "package.json missing"
              exit 1
          }

          Write-Host ""
          Write-Host "All required files are ready."


      # ==========================================
      # 7. Install Electron
      # ==========================================

      - name: Install dependencies
        shell: powershell
        run: |
          npm install


      # ==========================================
      # 8. Build Windows EXE
      # ==========================================

      - name: Build Windows EXE
        shell: powershell
        run: |
          npm run dist


      # ==========================================
      # 9. Verify EXE
      # ==========================================

      - name: Verify Windows EXE
        shell: powershell
        run: |
          Write-Host "================================"
          Write-Host "BUILD RESULTS"
          Write-Host "================================"

          if (!(Test-Path "dist")) {
              Write-Error "ERROR: dist folder was not created"
              exit 1
          }

          Get-ChildItem "dist" -Recurse

          $exeFiles = Get-ChildItem `
              -Path "dist" `
              -Filter "*.exe" `
              -File `
              -ErrorAction SilentlyContinue

          if (!$exeFiles) {
              Write-Error "ERROR: Windows EXE was not created"
              exit 1
          }

          Write-Host ""
          Write-Host "SUCCESS!"
          Write-Host ""

          foreach ($file in $exeFiles) {
              Write-Host "EXE:"
              Write-Host $file.FullName
              Write-Host ""
          }


      # ==========================================
      # 10. Upload EXE
      # ==========================================

      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: BendCalculator-Windows
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 30
