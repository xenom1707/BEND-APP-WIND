name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build-windows:
    runs-on: windows-latest

    steps:

      # ==============================
      # Checkout
      # ==============================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ==============================
      # Check index.html
      # ==============================

      - name: Check index.html
        shell: powershell
        run: |
          Write-Host "Checking repository..."

          Get-ChildItem

          if (!(Test-Path "index.html")) {
              Write-Error "ERROR: index.html was not found"
              exit 1
          }

          Write-Host "SUCCESS: index.html found"


      # ==============================
      # Check Node
      # ==============================

      - name: Check Node and NPM
        shell: powershell
        run: |
          Write-Host "Node:"
          node --version

          Write-Host "NPM:"
          npm --version


      # ==============================
      # Create main.js
      # ==============================

      - name: Create main.js
        shell: powershell
        run: |

          $mainJs = @'
          const { app, BrowserWindow } = require("electron");
          const path = require("path");

          function createWindow() {

              const win = new BrowserWindow({
                  width: 1280,
                  height: 850,

                  minWidth: 900,
                  minHeight: 650,

                  autoHideMenuBar: true,

                  webPreferences: {
                      contextIsolation: true,
                      nodeIntegration: false
                  }
              });

              win.loadFile(
                  path.join(__dirname, "index.html")
              );
          }


          app.whenReady().then(() => {

              createWindow();

              app.on("activate", () => {

                  if (BrowserWindow.getAllWindows().length === 0) {
                      createWindow();
                  }

              });

          });


          app.on("window-all-closed", () => {

              if (process.platform !== "darwin") {
                  app.quit();
              }

          });
          '@


          [System.IO.File]::WriteAllText(
              "$PWD\main.js",
              $mainJs,
              [System.Text.UTF8Encoding]::new($false)
          )

          Write-Host "main.js created"


      # ==============================
      # Create package.json
      # UTF-8 WITHOUT BOM
      # ==============================

      - name: Create package.json
        shell: powershell
        run: |

          $packageJson = @'
          {
            "name": "bend-calculator",
            "version": "4.0.1",
            "description": "Sheet Metal Bend Calculator",
            "author": "Shivanov",
            "main": "main.js",

            "scripts": {
              "start": "electron .",
              "dist": "electron-builder --win portable"
            },

            "devDependencies": {
              "electron": "33.4.11",
              "electron-builder": "25.1.8"
            },

            "build": {
              "appId": "com.shivanov.bendcalculator",

              "productName": "Bend Calculator",

              "asar": true,

              "files": [
                "index.html",
                "main.js",
                "package.json"
              ],

              "win": {
                "target": [
                  {
                    "target": "portable",
                    "arch": [
                      "x64"
                    ]
                  }
                ]
              },

              "artifactName": "BendCalculator-Windows-${version}.${ext}"
            }
          }
          '@


          [System.IO.File]::WriteAllText(
              "$PWD\package.json",
              $packageJson,
              [System.Text.UTF8Encoding]::new($false)
          )

          Write-Host "package.json created as UTF-8 without BOM"


      # ==============================
      # Validate package.json
      # ==============================

      - name: Validate package.json
        shell: powershell
        run: |

          Write-Host "Checking package.json..."

          Get-Content package.json

          node -e "JSON.parse(require('fs').readFileSync('package.json','utf8')); console.log('PACKAGE JSON VALID')"

          if ($LASTEXITCODE -ne 0) {
              Write-Error "ERROR: package.json is invalid"
              exit 1
          }


      # ==============================
      # Verify files
      # ==============================

      - name: Verify project files
        shell: powershell
        run: |

          Write-Host "============================"
          Write-Host "PROJECT FILES"
          Write-Host "============================"

          Get-ChildItem

          if (!(Test-Path "index.html")) {
              Write-Error "index.html missing"
              exit 1
          }

          if (!(Test-Path "main.js")) {
              Write-Error "main.js missing"
              exit 1
          }

          if (!(Test-Path "package.json")) {
              Write-Error "package.json missing"
              exit 1
          }

          Write-Host ""
          Write-Host "ALL FILES OK"


      # ==============================
      # Install Electron
      # ==============================

      - name: Install dependencies
        shell: powershell
        run: |

          npm install

          if ($LASTEXITCODE -ne 0) {
              Write-Error "npm install failed"
              exit 1
          }


      # ==============================
      # Build EXE
      # ==============================

      - name: Build Windows EXE
        shell: powershell
        run: |

          npm run dist

          if ($LASTEXITCODE -ne 0) {
              Write-Error "Windows build failed"
              exit 1
          }


      # ==============================
      # Verify EXE
      # ==============================

      - name: Verify EXE
        shell: powershell
        run: |

          Write-Host "============================"
          Write-Host "BUILD OUTPUT"
          Write-Host "============================"

          if (!(Test-Path "dist")) {
              Write-Error "ERROR: dist folder does not exist"
              exit 1
          }


          Get-ChildItem "dist" -Recurse


          $exeFiles = Get-ChildItem `
              -Path "dist" `
              -Filter "*.exe" `
              -File `
              -ErrorAction SilentlyContinue


          if (!$exeFiles) {

              Write-Error "ERROR: EXE was not created"

              exit 1
          }


          Write-Host ""
          Write-Host "============================"
          Write-Host "SUCCESS - EXE CREATED"
          Write-Host "============================"


          foreach ($file in $exeFiles) {

              Write-Host ""
              Write-Host "File:"
              Write-Host $file.Name

              Write-Host "Size:"
              Write-Host $file.Length

              Write-Host "Path:"
              Write-Host $file.FullName

          }


      # ==============================
      # Upload EXE
      # ==============================

      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: BendCalculator-Windows
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 30
